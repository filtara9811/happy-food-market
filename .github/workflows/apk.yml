name: Build APK (app)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "shell/**"
      - ".github/workflows/apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install and create the Android project
        working-directory: shell
        run: |
          npm install --no-audit --no-fund
          U=node_modules/@supabase/supabase-js/dist/umd/supabase.js; [ -f $U ] || U=$(find node_modules/@supabase/supabase-js/dist -path "*umd*" -name "*.js" | head -1); cp "$U" www/supabase.js
          test -s www/supabase.js
          # push notifications are switched on only when the Firebase file is saved as a GitHub secret
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo 'window.HF_PUSH=true;' > www/push-config.js; else echo 'window.HF_PUSH=false;' > www/push-config.js; fi
          npx cap add android
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; echo "push: ON"; else echo "push: OFF (no GOOGLE_SERVICES_JSON secret)"; fi
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <application#' $M
          # own icon, launch splash and the ring sound
          cp -r res/. android/app/src/main/res/
          npx cap sync android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Dark launch colour
        working-directory: shell
        continue-on-error: true
        run: |
          RES=android/app/src/main/res
          mkdir -p $RES/values
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="hf_bg">#0B0D14</color>\n</resources>\n' > $RES/values/hf_colors.xml
          sed -i 's#<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">#<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">\n        <item name="android:statusBarColor">\#0B0D14</item>\n        <item name="android:navigationBarColor">\#0B0D14</item>#' $RES/values/styles.xml

      # Same signing key every build, so a new APK installs over the old one.
      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp shell/signing/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: shell/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: Happy Food app ${{ github.run_number }}
          files: shell/android/app/build/outputs/apk/debug/app-debug.apk
