name: Build APK (app)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "shell/**"
      - ".github/workflows/apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: customer
            app_id: com.happyfood.market
            app_name: Happy Food
            res: res
            file: HappyFood.apk
          - flavor: rider
            app_id: com.happyfood.partner
            app_name: Happy Food Partner
            res: res-partner
            file: HappyFood-Partner.apk
          - flavor: vendor
            app_id: com.happyfood.shop
            app_name: Happy Food Shop
            res: res-shop
            file: HappyFood-Shop.apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install and create the Android project (${{ matrix.flavor }})
        working-directory: shell
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          APP_ID: ${{ matrix.app_id }}
          APP_NAME: ${{ matrix.app_name }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          npm install --no-audit --no-fund
          U=node_modules/@supabase/supabase-js/dist/umd/supabase.js; [ -f $U ] || U=$(find node_modules/@supabase/supabase-js/dist -path "*umd*" -name "*.js" | head -1); cp "$U" www/supabase.js
          test -s www/supabase.js
          cp node_modules/maplibre-gl/dist/maplibre-gl.js node_modules/maplibre-gl/dist/maplibre-gl.css www/
          node -e "const fs=require('fs'),f='capacitor.config.json',c=JSON.parse(fs.readFileSync(f));c.appId=process.env.APP_ID;c.appName=process.env.APP_NAME;fs.writeFileSync(f,JSON.stringify(c,null,2))"
          printf 'window.HF_APP={role:"%s",name:"%s"};\n' "$FLAVOR" "$APP_NAME" > www/app-config.js
          # push is switched on only when the Firebase file contains this app's package name
          PUSH=false
          if [ -n "$GOOGLE_SERVICES_JSON" ] && printf '%s' "$GOOGLE_SERVICES_JSON" | grep -q "\"$APP_ID\""; then PUSH=true; fi
          echo "window.HF_PUSH=$PUSH;" > www/push-config.js
          npx cap add android
          if [ "$PUSH" = true ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; fi
          echo "flavor=$FLAVOR appId=$APP_ID push=$PUSH"
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <application#' $M
          # own icon, launch splash and the ring sound for this app
          cp -r ${{ matrix.res }}/. android/app/src/main/res/
          npx cap sync android

      - name: Dark status bar
        working-directory: shell
        continue-on-error: true
        run: |
          RES=android/app/src/main/res
          sed -i 's#<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">#<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">\n        <item name="android:statusBarColor">\#0B0D14</item>\n        <item name="android:navigationBarColor">\#0B0D14</item>#' $RES/values/styles.xml

      # Same signing key every build, so a new APK installs over the old one.
      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp shell/signing/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: shell/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: |
          mkdir -p out
          cp shell/android/app/build/outputs/apk/debug/app-debug.apk "out/${{ matrix.file }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.flavor }}
          path: out/${{ matrix.file }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true
      - run: ls -l apks
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: Happy Food apps ${{ github.run_number }}
          files: apks/*.apk
