{"name":"Build APK","permissions":{"contents":"write"},"jobs":{"build":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"Unpack app files from happy_food_bundle.txt","run":"python3 - <<'PY'\nimport re, pathlib\nt = open('happy_food_bundle.txt', encoding='utf-8').read()\nparts = re.split(r'^=====FILE: (.+?)=====\\n', t, flags=re.M)\nfor i in range(1, len(parts), 2):\n    p = pathlib.Path('app') / parts[i].strip()\n    p.parent.mkdir(parents=True, exist_ok=True)\n    p.write_text(parts[i + 1], encoding='utf-8')\n    print('wrote', p)\nPY\n"},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"uses":"subosito/flutter-action@v2","with":{"channel":"stable","cache":true}},{"name":"Generate Android project around our code","working-directory":"app","run":"cp -r lib /tmp/lib_backup\ncp pubspec.yaml /tmp/pubspec_backup.yaml\nflutter create . --platforms=android --org com.happyfood --project-name happy_food_market\nrm -rf lib test\ncp -r /tmp/lib_backup lib\ncp /tmp/pubspec_backup.yaml pubspec.yaml\n# internet + location permissions\nsed -i 's#<application#<uses-permission android:name=\"android.permission.INTERNET\"/>\\n    <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"/>\\n    <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"/>\\n    <application#' android/app/src/main/AndroidManifest.xml\n# app name on the home screen\nsed -i 's#android:label=\"[^\"]*\"#android:label=\"Happy Food\"#' android/app/src/main/AndroidManifest.xml\n"},{"name":"Get packages","working-directory":"app","run":"flutter pub get"},{"name":"Dark launch screen + app icon","working-directory":"app","continue-on-error":true,"run":"RES=android/app/src/main/res\nfor f in $RES/drawable/launch_background.xml $RES/drawable-v21/launch_background.xml; do\n  [ -d \"$(dirname $f)\" ] && printf '<?xml version=\"1.0\" encoding=\"utf-8\"?>\\n<layer-list xmlns:android=\"http://schemas.android.com/apk/res/android\">\\n    <item android:drawable=\"@color/hf_bg\" />\\n</layer-list>\\n' > $f\ndone\nmkdir -p $RES/values $RES/values-v31 $RES/values-night-v31\nprintf '<?xml version=\"1.0\" encoding=\"utf-8\"?>\\n<resources><color name=\"hf_bg\">#0F0F15</color></resources>\\n' > $RES/values/hf_colors.xml\nS='<?xml version=\"1.0\" encoding=\"utf-8\"?>\\n<resources>\\n    <style name=\"LaunchTheme\" parent=\"@android:style/Theme.Black.NoTitleBar\">\\n        <item name=\"android:windowSplashScreenBackground\">#0F0F15</item>\\n        <item name=\"android:windowBackground\">@drawable/launch_background</item>\\n    </style>\\n    <style name=\"NormalTheme\" parent=\"@android:style/Theme.Black.NoTitleBar\">\\n        <item name=\"android:windowBackground\">?android:colorBackground</item>\\n    </style>\\n</resources>\\n'\nprintf \"$S\" > $RES/values-v31/styles.xml\nprintf \"$S\" > $RES/values-night-v31/styles.xml\nmkdir -p assets/icon\npip install pillow\npython3 - <<'PY'\nfrom PIL import Image, ImageDraw, ImageFont\nimport glob\ndef logo(size, scale):\n    im = Image.new('RGBA', (size, size), (0, 0, 0, 0))\n    d = ImageDraw.Draw(im)\n    r = int(size * scale / 2); c = size // 2\n    for i in range(r, 0, -1):\n        k = i / r\n        col = (int(246 - 46 * (1 - k)), int(210 - 66 * (1 - k)), int(122 - 80 * (1 - k)), 255)\n        d.ellipse([c - i, c - i, c + i, c + i], fill=col)\n    f = None\n    for p in glob.glob('/usr/share/fonts/**/*Bold*.ttf', recursive=True):\n        f = p; break\n    font = ImageFont.truetype(f, int(r * 0.95)) if f else ImageFont.load_default()\n    d.text((c, c), 'HF', font=font, fill=(26, 19, 4, 255), anchor='mm')\n    return im\nfull = Image.new('RGBA', (1024, 1024), (15, 15, 21, 255))\nfull.alpha_composite(logo(1024, 0.78))\nfull.save('assets/icon/icon.png')\nlogo(1024, 0.56).save('assets/icon/icon_fg.png')\nPY\ndart run flutter_launcher_icons\n"},{"name":"Build release APK","working-directory":"app","run":"flutter build apk --release"},{"uses":"softprops/action-gh-release@v2","with":{"tag_name":"build-${{ github.run_number }}","name":"Happy Food build ${{ github.run_number }}","files":"app/build/app/outputs/flutter-apk/app-release.apk"}}]}},"on":{"workflow_dispatch":{}}}