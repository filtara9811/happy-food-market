name: Flutter shop app

on:
  workflow_dispatch:
  push:
    branches: [flutter-shop]
    paths:
      - "shop_flutter/**"
      - ".github/workflows/flutter-shop.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shop_flutter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the platform folders (keeps our lib/ and pubspec)
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          flutter create --org com.happyfood --project-name hf_shop --platforms android .
          rm -rf test
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="hf_shop"#android:label="Happy Food Shop"#' $M
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN"/>\n    <application#' $M
          # the request screen may open over the lock screen like a phone call
          sed -i '0,/<activity/s//<activity android:showWhenLocked="true" android:turnScreenOn="true"/' $M
          sed -i 's#</manifest>#  <queries>\n    <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>\n    <intent><action android:name="android.intent.action.DIAL"/><data android:scheme="tel"/></intent>\n    <package android:name="com.whatsapp"/>\n  </queries>\n</manifest>#' $M
          grep -n "label\|permission\|activity" $M | head -20
          # same app id as the Partner app (push + Play Store listing), newer phones API 24+, desugaring for notifications
          python3 - <<'PY'
          import os, re
          f = next(p for p in ['android/app/build.gradle.kts', 'android/app/build.gradle'] if os.path.exists(p))
          t = open(f).read(); kts = f.endswith('.kts')
          t = re.sub(r'applicationId\s*=?\s*"[^"]+"', 'applicationId = "com.happyfood.shop"' if kts else 'applicationId "com.happyfood.shop"', t)
          t = re.sub(r'minSdk(Version)?\s*=?\s*flutter\.minSdkVersion', 'minSdk = 24' if kts else 'minSdkVersion 24', t)
          t = t.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true' if kts else 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
          t += ('\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' if kts else "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n")
          open(f, 'w').write(t); print(f); print(t)
          PY
          # app icon + ring sound from the Shop app
          for d in ../shell/res-shop/mipmap-*; do mkdir -p android/app/src/main/res/$(basename $d); cp $d/ic_launcher.png android/app/src/main/res/$(basename $d)/ic_launcher.png || true; done
          mkdir -p android/app/src/main/res/raw && printf '<?xml version="1.0" encoding="utf-8"?>\n<resources xmlns:tools="http://schemas.android.com/tools" tools:keep="@raw/ring" />\n' > android/app/src/main/res/raw/keep.xml
          cp ../shell/res-shop/raw/ring.wav android/app/src/main/res/raw/ring.wav
          # Firebase (push) settings for com.happyfood.shop from the GOOGLE_SERVICES_JSON secret
          python3 - <<'PY'
          import json, os
          s = os.environ.get('GSJ', ''); out = None
          try:
              d = json.loads(s); p = d['project_info']
              c = [x for x in d['client'] if x['client_info']['android_client_info']['package_name'] == 'com.happyfood.shop'][0]
              out = "const fbOk = true;\nconst fbApiKey = '%s';\nconst fbAppId = '%s';\nconst fbSender = '%s';\nconst fbProject = '%s';\n" % (c['api_key'][0]['current_key'], c['client_info']['mobilesdk_app_id'], p['project_number'], p['project_id'])
          except Exception as e:
              print('push off:', type(e).__name__)
          if out:
              open('lib/fb_opts.dart', 'w').write('// generated in CI\n' + out); print('push on')
          PY

      - name: Bundle fonts (Hindi + numbers) so the app works offline
        run: |
          mkdir -p assets/fonts && cd assets/fonts
          B=https://raw.githubusercontent.com/google/fonts/main/ofl
          for w in Regular Medium SemiBold Bold ExtraBold; do curl -fsSL -o Mukta-$w.ttf "$B/mukta/Mukta-$w.ttf"; done
          curl -fsSL -o Outfit.ttf "$B/outfit/Outfit%5Bwght%5D.ttf"
          ls -l

      - name: Same signing key every build
        run: |
          mkdir -p ~/.android
          cp ../shell/signing/debug.keystore ~/.android/debug.keystore

      - run: flutter --version && flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
      - name: Build APK and web
        run: |
          set -o pipefail
          ok=1
          flutter build apk --release --build-number=$((2000 + ${{ github.run_number }})) 2>&1 | tee ../build.log || ok=0
          if [ $ok = 0 ]; then
            # logs are not readable from the agent sandbox, so surface the errors as annotations
            msg=$( (grep -E -A8 "rror|lib/.*dart:[0-9]+|wrong" ../build.log || tail -40 ../build.log) | head -90 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' || true)
            echo "::error title=build::$msg"
            exit 1
          fi

      - name: Collect
        run: |
          mkdir -p ../out
          cp build/app/outputs/flutter-apk/app-release.apk ../out/HappyFood-Shop-Flutter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: shop-flutter
          path: out/*

      # pre-release so the customer app's "latest release" update check is not affected
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: shop-${{ github.run_number }}
          name: Shop app (Flutter) ${{ github.run_number }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: |
            out/HappyFood-Shop-Flutter.apk
