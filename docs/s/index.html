<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Happy Food दुकान</title>
<meta name="theme-color" content="#16120b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@500;700;800&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f1e6;--card:#fff;--card2:#efe8d6;--line:rgba(0,0,0,.11);--tx:#1a1a24;--mut:#585870;--gold:#9a6a10;--ok:#15803d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Mukta,Outfit,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding-bottom:120px}
.wrap{max-width:560px;margin:0 auto}
.hero{background:radial-gradient(120% 90% at 80% 0,rgba(226,176,74,.22),transparent 60%),linear-gradient(165deg,#2a2112,#16120b 55%,#0b0d14);color:#fff;padding:22px 16px 20px;border-radius:0 0 30px 30px}
.brand{font-family:Outfit;font-weight:900;font-size:13px;letter-spacing:1.5px;color:#fde68a}
.shop{display:flex;gap:14px;align-items:center;margin-top:14px}
.av{width:68px;height:68px;border-radius:20px;flex-shrink:0;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,#fce49d,#b88222);color:#2a1a00;font:900 24px Outfit;border:3px solid rgba(255,255,255,.85)}
.av img{width:100%;height:100%;object-fit:cover}
h1{font:800 22px Outfit;line-height:1.15}
.sub{font-size:13px;color:rgba(255,255,255,.7);margin-top:2px}
.st{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:4px 11px;border-radius:99px;font-size:12px;font-weight:800;background:rgba(34,197,94,.18);color:#86efac}
.st.off{background:rgba(255,255,255,.1);color:rgba(255,255,255,.7)}
.st i{width:8px;height:8px;border-radius:50%;background:currentColor}
.search{margin:14px 16px 0;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 14px;height:46px}
.search input{flex:1;border:0;outline:0;font:600 15px Mukta;background:transparent}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px}
.it{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px;display:flex;flex-direction:column}
.it .im{aspect-ratio:1;border-radius:14px;overflow:hidden;background:#fff3d6;display:grid;place-items:center;font-size:40px}
.it .im img{width:100%;height:100%;object-fit:cover}
.it b{font-size:14px;font-weight:800;margin-top:8px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{display:flex;align-items:baseline;gap:6px;margin-top:4px}
.pr span{font:800 17px Outfit;color:var(--gold)}
.pr s{font-size:12px;color:var(--mut)}
.add{margin-top:auto;padding-top:8px}
.add button{width:100%;height:38px;border-radius:12px;border:0;font:800 14px Mukta;background:linear-gradient(180deg,#fde68a,#f2b632);color:#2a1a00}
.qty{display:flex;align-items:center;justify-content:space-between;height:38px;border-radius:12px;background:#16120b;color:#fff;padding:0 4px}
.qty button{width:32px;height:32px;border:0;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font:900 18px Outfit}
.qty span{font:800 15px Outfit}
.left{font-size:11px;color:var(--mut);font-weight:700;margin-top:2px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(0,0,0,.08);display:none}
.bar .in{max-width:560px;margin:0 auto}
.bar input,.bar textarea{width:100%;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:10px 12px;font:600 14px Mukta;margin-bottom:8px;outline:0}
.wa{width:100%;height:50px;border:0;border-radius:16px;background:#16a34a;color:#fff;font:800 16px Mukta;display:flex;align-items:center;justify-content:center;gap:10px}
.msg{padding:50px 20px;text-align:center;color:var(--mut);font-weight:700}
.msg div{font-size:48px}
.foot{text-align:center;padding:24px 16px;color:var(--mut);font-size:12px}
.foot p:first-child{letter-spacing:4px;color:#b98a2c;font-weight:800;font-size:11px}
.foot strong{display:block;font:700 19px Georgia,serif;color:var(--tx);margin:2px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><p class="brand">HAPPY FOOD</p><div class="shop" id="shop"><div class="av">🏪</div><div><h1>लोड हो रहा है…</h1></div></div></div>
  <div id="body"></div>
  <div class="foot"><p>POWERED BY</p><strong>Filipra Private Limited</strong><p>© 2026 Happy Food · Made in India 🇮🇳</p></div>
</div>
<div class="bar" id="bar"><div class="in">
  <input id="cn" placeholder="आपका नाम" autocomplete="name">
  <textarea id="ca" rows="2" placeholder="पूरा पता (मकान, गली, इलाका)"></textarea>
  <button class="wa" id="go"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2s.2-1.1.2-1.2-.2-.2-.5-.3z"/></svg><span id="gol">WhatsApp पर ऑर्डर भेजें</span></button>
</div></div>
<script>
const SB = 'https://pboelnbjgyllqqlkqaqm.supabase.co', KEY = 'sb_publishable_v7qyttkDD2DtFpSGSWAxrw__9K80eRz';
const q = new URLSearchParams(location.search), id = q.get('v') || q.get('shop');
const cart = {}; let S = null, filt = '';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const imgOf = u => !u ? '' : (String(u).startsWith('asset:') ? '../img/' + String(u).slice(6) + '.webp' : u);
const rs = n => '₹' + Math.round(Number(n) || 0).toLocaleString('en-IN');
try { const s = JSON.parse(localStorage.getItem('hf_shop_cust') || '{}'); document.getElementById('cn').value = s.n || ''; document.getElementById('ca').value = s.a || ''; } catch (e) { }
function msg(ic, t) { document.getElementById('body').innerHTML = `<div class="msg"><div>${ic}</div>${t}</div>`; }
async function load() {
  if (!/^[0-9a-f-]{36}$/i.test(id || '')) { document.querySelector('#shop h1').textContent = 'दुकान नहीं मिली'; msg('🔍', 'यह लिंक अधूरा है। दुकान वाले से नया लिंक माँगें।'); return; }
  try {
    const r = await fetch(SB + '/rest/v1/rpc/public_shop', { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_id: id }) });
    S = await r.json(); if (!r.ok || !S || !S.id) throw new Error('nf');
  } catch (e) { document.querySelector('#shop h1').textContent = 'दुकान नहीं मिली'; msg('😕', 'यह दुकान अभी नहीं खुल रही। थोड़ी देर बाद कोशिश करें।'); return; }
  document.title = S.name + ' • Happy Food';
  const ini = String(S.name || 'HF').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
  document.getElementById('shop').innerHTML = `<div class="av">${S.photo && S.photo.length > 30 ? `<img src="${esc(S.photo)}" alt="">` : esc(ini)}</div><div><h1>${esc(S.name)}</h1><p class="sub">📍 ${esc(S.address || '')}</p><span class="st ${S.open ? '' : 'off'}"><i></i>${S.open ? 'दुकान खुली है' : 'अभी बंद है'}</span></div>`;
  if (!S.live || S.qr_on === false) { msg('⏳', 'यह दुकान अभी ऑनलाइन ऑर्डर नहीं ले रही।'); return; }
  paint();
}
function paint() {
  const items = (S.items || []).filter(i => !filt || (i.name + ' ' + (i.name_hi || '')).toLowerCase().includes(filt));
  const list = items.length ? `<div class="grid">${items.map(i => { const n = cart[i.id] || 0; return `<div class="it"><div class="im">${i.image_url ? `<img src="${esc(imgOf(i.image_url))}" alt="" loading="lazy">` : '🍛'}</div><b>${esc(i.name_hi || i.name)}</b><div class="pr"><span>${rs(i.price)}</span>${i.mrp && Number(i.mrp) > Number(i.price) ? `<s>${rs(i.mrp)}</s>` : ''}</div><p class="left">${i.qty <= 5 ? 'सिर्फ़ ' + i.qty + ' बचे' : 'स्टॉक में'}</p><div class="add">${n ? `<div class="qty"><button onclick="add('${i.id}',-1)">−</button><span>${n}</span><button onclick="add('${i.id}',1)">+</button></div>` : `<button onclick="add('${i.id}',1)">+ जोड़ें</button>`}</div></div>`; }).join('')}</div>`
    : `<div class="msg"><div>📦</div>${(S.items || []).length ? 'इस खोज में कुछ नहीं मिला' : 'अभी कोई सामान स्टॉक में नहीं'}</div>`;
  document.getElementById('body').innerHTML = (S.items || []).length > 4 ? `<label class="search">🔍<input id="q" value="${esc(filt)}" placeholder="सामान खोजें" oninput="filt=this.value.toLowerCase();paint();document.getElementById('q').focus()"></label>` + list : list;
  const cnt = Object.values(cart).reduce((a, b) => a + b, 0), tot = (S.items || []).reduce((s, i) => s + (cart[i.id] || 0) * Number(i.price), 0);
  document.getElementById('bar').style.display = cnt ? 'block' : 'none';
  document.getElementById('gol').textContent = `${cnt} सामान • ${rs(tot)} — WhatsApp पर भेजें`;
}
function add(i, d) { const it = S.items.find(x => x.id === i); const n = Math.max(0, Math.min(it ? it.qty : 99, (cart[i] || 0) + d)); if (n) cart[i] = n; else delete cart[i]; paint(); }
document.getElementById('go').onclick = () => {
  const n = document.getElementById('cn').value.trim(), a = document.getElementById('ca').value.trim();
  if (!n || a.length < 5) { alert('नाम और पूरा पता लिखें'); return; }
  try { localStorage.setItem('hf_shop_cust', JSON.stringify({ n, a })); } catch (e) { }
  const lines = S.items.filter(i => cart[i.id]).map(i => `• ${cart[i.id]} × ${i.name_hi || i.name} = ${rs(cart[i.id] * i.price)}`);
  const tot = S.items.reduce((s, i) => s + (cart[i.id] || 0) * Number(i.price), 0);
  const text = `🛒 नया ऑर्डर — ${S.name}\n\n${lines.join('\n')}\n\nकुल: ${rs(tot)}\n\n👤 ${n}\n📍 ${a}\n\n(Happy Food डिजिटल दुकान से)`;
  const ph = String(S.phone || '').replace(/\D/g, '');
  location.href = 'https://wa.me/' + (ph ? (ph.length === 10 ? '91' + ph : ph) : '') + '?text=' + encodeURIComponent(text);
};
load();
</script>
</body>
</html>
